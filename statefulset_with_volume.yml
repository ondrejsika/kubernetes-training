apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-sts-with-volume
spec:
  replicas: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  selector:
    matchLabels:
      app: my-sts-with-volume
  template:
    metadata:
      labels:
        app: my-sts-with-volume
        svc: example
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
      containers:
        - name: main
          image: ghcr.io/ondrejsika/training-example:v1
          # image: ghcr.io/ondrejsika/training-example:v2
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
              cpu: 20m
